services:

  php:
    build:
      context: .
      dockerfile: php/Containerfile
    container_name: pfmea-php
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./app:/var/www/html
      - ./php/php.ini:/usr/local/etc/php/conf.d/php.ini:ro
      - ./php/opcache.ini:/usr/local/etc/php/conf.d/opcache.ini:ro
    environment:
      TZ: Asia/Jakarta
    depends_on:
      - redis
    networks:
      - pfmea-network

  nginx:
    image: docker.io/library/nginx:stable-alpine
    container_name: pfmea-nginx
    restart: unless-stopped
    depends_on:
      - php
    ports:
      - "8007:80"
    volumes:
      - ./app:/var/www/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - pfmea-network

  redis:
    image: docker.io/library/redis:7-alpine
    container_name: pfmea-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - pfmea-network

networks:
  pfmea-network:

volumes:
  redis-data: